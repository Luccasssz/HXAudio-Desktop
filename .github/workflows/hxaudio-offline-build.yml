name: HXAudio APO diagnostic - offline build

on:
  workflow_dispatch:
  push:
    branches:
      - "diagnostic/**"

permissions:
  contents: read

jobs:
  build-and-offline-test:
    name: Windows 2022 / MSVC v143 / offline only
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out patched repository
        uses: actions/checkout@v4

      - name: Show compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe missing' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Compatible Visual Studio MSBuild installation not found' }
          Write-Host "Visual Studio: $vs"
          nuget help | Select-Object -First 2

      - name: Restore pinned Windows SDK NuGet packages
        shell: pwsh
        run: |
          $version = '10.0.28000.1839'
          $source = 'https://api.nuget.org/v3/index.json'
          foreach ($package in @('Microsoft.Windows.SDK.CPP', 'Microsoft.Windows.SDK.CPP.x64')) {
            & nuget install $package -Version $version -OutputDirectory packages -Source $source -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "NuGet install failed: $package" }
          }
          $expected = @(
            'packages\Microsoft.Windows.SDK.CPP.10.0.28000.1839\build\Microsoft.Windows.SDK.cpp.props',
            'packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.1839\build\native\Microsoft.Windows.SDK.cpp.x64.props',
            'packages\Microsoft.Windows.SDK.CPP.10.0.28000.1839\build\Microsoft.Windows.SDK.cpp.targets'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Project SDK import missing: $file" }
          }

      - name: Compile without signing or packaging
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File .\build.ps1 -BuildOnly 2>&1 | Tee-Object -FilePath hxaudio-build.log
          $buildExit = $LASTEXITCODE
          "build exit code: $buildExit" | Tee-Object -FilePath hxaudio-results.log -Append
          if ($buildExit -ne 0) { throw "Build failed: $buildExit" }

      - name: Test DSP, APO, and endpoint diagnostics offline
        shell: pwsh
        run: |
          $control = (Resolve-Path '.\ControlPanel\x64\Release\HXAudioControl.exe').Path
          $helper = (Resolve-Path '.\DriverSetup\x64\Release\HXAudioDriverSetup.exe').Path
          $apo = (Resolve-Path '.\Apo\x64\Release\HXAudioApo.dll').Path
          Get-FileHash -Algorithm SHA256 $control, $helper, $apo | Format-List | Out-File hxaudio-hashes.log
          function Test-Executable($name, $exe, $arguments) {
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput "hxaudio-$name.log" -RedirectStandardError "hxaudio-$name-error.log"
            Get-Content "hxaudio-$name.log"
            Get-Content "hxaudio-$name-error.log"
            "$name exit code: $($p.ExitCode)" | Tee-Object -FilePath hxaudio-results.log -Append
            if ($p.ExitCode -ne 0) { throw "$name failed: $($p.ExitCode)" }
          }
          foreach ($cmd in @('prepare-apo-install', 'apo-install fake.dll', 'apo-install-effects fake.dll', 'apo-refresh')) {
            $p = Start-Process $helper -ArgumentList $cmd -Wait -PassThru -RedirectStandardOutput 'hxaudio-gate-out.log' -RedirectStandardError 'hxaudio-gate-err.log'
            "$cmd exit=$($p.ExitCode)" | Tee-Object -FilePath hxaudio-gate-results.log -Append
            if ($p.ExitCode -ne 58) { throw "Fail-closed gate failed for $cmd : $($p.ExitCode)" }
          }
          Test-Executable 'diagnostic' $helper 'apo-diagnostic-self-test'
          Test-Executable 'dsp' $control '--dsp-self-test'
          Test-Executable 'apo' $helper "apo-self-test `"$apo`""

      - name: Test purge and CompositeFX planner with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          cl /nologo /EHsc /std:c++17 /W4 /WX tests\safety_tests.cpp /Fe:safety-tests.exe
          if errorlevel 1 exit /b 1
          safety-tests.exe > hxaudio-safety-tests.log 2>&1
          if errorlevel 1 exit /b 1
          type hxaudio-safety-tests.log
          cl /nologo /EHsc /std:c++17 /W4 /WX tests\restore_plan_tests.cpp /Fe:restore-plan-tests.exe
          if errorlevel 1 exit /b 1
          restore-plan-tests.exe > hxaudio-restore-plan-tests.log 2>&1
          if errorlevel 1 exit /b 1
          type hxaudio-restore-plan-tests.log

      - name: Compile Inno script only (never run installer)
        shell: pwsh
        run: |
          & nuget install Tools.InnoSetup -Version 7.1.0 -OutputDirectory ci-tools -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler restore failed' }
          $iscc = Get-ChildItem ci-tools/Tools.InnoSetup.7.1.0 -Recurse -Filter ISCC.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Inno compiler not found' }
          New-Item -ItemType Directory -Force artifacts/apo-staging | Out-Null
          Copy-Item ControlPanel/x64/Release/HXAudioControl.exe,DriverSetup/x64/Release/HXAudioDriverSetup.exe,Apo/x64/Release/HXAudioApo.dll artifacts/apo-staging/
          & $iscc /DMyAppVersion=0.0.0-ci /DMyApoFileName=HXAudioApo.dll Installer/HXAudioApoOnly.iss 2>&1 | Tee-Object hxaudio-inno-compile.log
          $isccExit = $LASTEXITCODE
          Get-ChildItem artifacts -Filter '*.exe' -File | Remove-Item -Force
          if ($isccExit -ne 0) { throw "Inno compilation failed: $isccExit" }

      - name: Upload offline build evidence (unsigned, NOT for installation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hxaudio-offline-evidence-unsigned
          if-no-files-found: warn
          retention-days: 30
          path: |
            hxaudio-*.log
            ControlPanel/x64/Release/HXAudioControl.exe
            DriverSetup/x64/Release/HXAudioDriverSetup.exe
            Apo/x64/Release/HXAudioApo.dll
